name: Promote to Production

on:
  repository_dispatch:
    types: [promote-prod]

jobs:
  promote:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Prod Image Tags
        working-directory: apps/poke-db/overlays/prod
        run: |
          kustomize edit set image \
            "ghcr.io/jacobpotter/poke-db-api=${{ github.event.client_payload.api_image }}" \
            "ghcr.io/jacobpotter/poke-db-frontend=${{ github.event.client_payload.frontend_image }}"

      - name: Commit and Push
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): prod -> sha-${{ github.event.client_payload.short_sha }}"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main"
            git pull --rebase origin main
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1
