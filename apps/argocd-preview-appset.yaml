# One preview environment per open PR labelled "preview" in JacobPotter/poke-db.
# Each gets namespace poke-db-pr-<N>, its own Postgres, and commit-specific
# images (sha-<short>) published by CI. Routes are exposed at /pr-<N>/ on poke-db.pttr-dev-lab.
# The refresh-db-seed PostSync hook seeds it on first sync.
# Removing the label or closing the PR deletes the Application; delete the
# leftover namespace with: kubectl delete ns poke-db-pr-<N>
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: poke-db-previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        requeueAfterSeconds: 300
        github:
          owner: JacobPotter
          repo: poke-db
          labels:
            - preview
          # Recommended to avoid GitHub API rate limits (required if the repo is private):
          # tokenRef:
          #   secretName: github-token
          #   key: token
  template:
    metadata:
      name: 'poke-db-pr-{{.number}}'
      annotations:
        notifications.argoproj.io/subscribe.on-sync-running.github: ""
        notifications.argoproj.io/subscribe.on-sync-succeeded.github: ""
        notifications.argoproj.io/subscribe.on-sync-failed.github: ""
        notifications.argoproj.io/subscribe.on-health-degraded.github: ""
    spec:
      project: default
      source:
        repoURL: https://github.com/JacobPotter/poke-db-gitops.git
        targetRevision: main
        path: overlays/preview
        kustomize:
          namespace: 'poke-db-pr-{{.number}}'
          images:
            - 'ghcr.io/jacobpotter/poke-db-api=ghcr.io/jacobpotter/poke-db-api:sha-{{.head_short_sha}}'
            - 'ghcr.io/jacobpotter/poke-db-frontend=ghcr.io/jacobpotter/poke-db-frontend:sha-{{.head_short_sha}}'
          patches:
            - target:
                kind: HTTPRoute
                name: frontend
              patch: |-
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: frontend
                spec:
                  rules:
                    - matches:
                        - path:
                            type: PathPrefix
                            value: /pr-{{.number}}/
                        - path:
                            type: PathPrefix
                            value: /pr-{{.number}}
                      filters:
                        - type: URLRewrite
                          urlRewrite:
                            path:
                              type: ReplacePrefixMatch
                              replacePrefixMatch: /
                      backendRefs:
                        - name: frontend
                          port: 80
      destination:
        server: https://kubernetes.default.svc
        namespace: 'poke-db-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
