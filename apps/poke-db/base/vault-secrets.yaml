apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: poke-db-api-secret
spec:
  vaultAuthRef: poke-db-auth
  mount: secret
  type: kv-v2
  path: poke-db/api
  destination:
    name: api-secret
    create: true
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: api
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: poke-db-postgres-secret
spec:
  vaultAuthRef: poke-db-auth
  mount: secret
  type: kv-v2
  path: poke-db/postgres
  destination:
    name: postgres-secret
    create: true
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: postgres
