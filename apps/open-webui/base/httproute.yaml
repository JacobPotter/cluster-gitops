apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  labels:
    app: open-webui
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "open-webui.pttr-dev-lab"
    - "chat.pttr-dev-lab"
    - "ai.pttr-dev-lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: open-webui
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-lan
  labels:
    app: open-webui
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: default
      sectionName: http
  hostnames:
    - "open-webui.pttr-dev-lab"
    - "chat.pttr-dev-lab"
    - "ai.pttr-dev-lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: open-webui
          port: 8080
