apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-http-to-https-redirect
  namespace: default
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: default
      sectionName: http
  hostnames:
    - "argo.webwizardssoftware.com"
    - "poke-db.webwizardssoftware.com"
    - "*.poke-db.webwizardssoftware.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
