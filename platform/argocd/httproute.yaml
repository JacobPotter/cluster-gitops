apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-subdomain-route
  namespace: argocd
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "argo.pttr-dev-lab"
    - "argo.webwizardssoftware.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-lan-route
  namespace: argocd
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: default
      sectionName: http
  hostnames:
    - "argo.pttr-dev-lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
