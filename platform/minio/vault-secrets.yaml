apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: minio-secret
  namespace: minio
spec:
  vaultAuthRef: minio-auth
  mount: secret
  type: kv-v2
  path: minio
  destination:
    name: minio-secret
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: minio
